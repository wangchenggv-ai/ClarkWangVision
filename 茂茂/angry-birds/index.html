<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>愤怒的小鸟 · Blu 的冒险</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(180deg, #6fb7ff 0%, #bfe5ff 100%);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 16px; color: #222;
  }
  h1 { margin-bottom: 8px; color: #c0392b; text-shadow: 1px 1px 0 #fff; }
  #hud {
    width: 1024px; display: flex; justify-content: space-between;
    padding: 8px 16px; background: rgba(255,255,255,.75); border-radius: 8px;
    margin-bottom: 6px; font-weight: 600;
  }
  #hud span { margin-right: 12px; }
  #wrap { position: relative; width: 1024px; height: 576px; }
  canvas {
    display: block; background: linear-gradient(180deg, #87ceeb 0%, #b8e0a3 70%, #8bc34a 100%);
    border: 3px solid #333; border-radius: 8px; cursor: crosshair;
  }
  #overlay {
    position: absolute; inset: 0; display: none;
    background: rgba(0,0,0,.55); color: #fff;
    align-items: center; justify-content: center; flex-direction: column;
    border-radius: 8px; font-size: 28px; z-index: 10;
  }
  #overlay button {
    margin-top: 16px; padding: 10px 28px; font-size: 18px;
    background: #e74c3c; color: #fff; border: none; border-radius: 6px;
    cursor: pointer; font-weight: 600;
  }
  #overlay button:hover { background: #c0392b; }
  #tip {
    width: 1024px; margin-top: 8px; padding: 8px 12px;
    background: rgba(255,255,255,.75); border-radius: 6px; font-size: 13px;
  }
</style>
</head>
<body>
  <h1>🐦 愤怒的小鸟 · Blu 的冒险</h1>
  <div id="hud">
    <div><span id="lvl">关卡 1 / 10</span><span id="left">剩余小鸟：-</span></div>
    <div><span id="cur">当前：-</span><span id="skill">技能：-</span></div>
  </div>
  <div id="wrap">
    <canvas id="cv" width="1024" height="576"></canvas>
    <div id="overlay">
      <div id="msg">---</div>
      <button id="btn">下一关</button>
    </div>
  </div>
  <div id="tip">操作：按住左键拖动弹弓瞄准 → 松开发射；飞行中单击左键触发当前鸟技能（每只仅一次）。</div>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
  <script src="birds.js"></script>
  <script src="levels.js"></script>
  <script src="game.js"></script>
</body>
</html>
