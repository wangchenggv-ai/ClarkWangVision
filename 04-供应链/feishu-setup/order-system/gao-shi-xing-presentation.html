        <div class="flex-1 flex items-center justify-center p-8 pt-20" id="slides-container">

            // 第10页 CDSA临床数据战略联盟
            `<div class="max-w-5xl mx-auto">

            // 第11页 AI应用

            // 第12页 合作模式
            `<div class="max-w-4xl mx-auto text-center">
                <div class="text-3xl mb-8">首批20家合作机构</div>
                <div class="inline-block bg-white/10 px-12 py-6 rounded-3xl text-xl">免费部署CDSS系统</div>
                <div class="mt-12 text-sm text-zinc-400">共同积累5000例临床数据</div>
            </div>`,

            // 第13页 总结
            `<div class="max-w-4xl mx-auto text-center">
                <div class="text-4xl font-medium mb-12">临床证据·产品创新·数据决策</div>
                <div class="text-zinc-400">真正的突破，来自每一位临床医生的实践</div>
            </div>`,

            // 第14页 收尾金句
            `<div class="max-w-4xl mx-auto text-center h-full flex items-center justify-center">
                <div class="text-5xl leading-tight font-light max-w-2xl">
                    临床证据指引方向，<br>技术创新提供工具，<br>真正的突破，来自在座每一位的临床实践。
                </div>
            </div>`
        ];

        let current = 0;

        function render() {
            document.getElementById('slides-container').innerHTML = slides[current];
            document.getElementById('page-info').textContent = `${current + 1} / ${slides.length}`;
        }

        function next() {
            current = (current + 1) % slides.length;
            render();
        }

        function prev() {
            current = (current - 1 + slides.length) % slides.length;
            render();
        }

        // 初始化
        render();

        // 键盘支持
        document.addEventListener('keydown', e => {
            if (e.key === 'ArrowRight') next();
            if (e.key === 'ArrowLeft') prev();
        });

        console.log('%c高视星学术交流会PPT加载完成 - 学术专业版', 'color:#1A5276;font-size:13px');
    </script>
</body>
</html>
