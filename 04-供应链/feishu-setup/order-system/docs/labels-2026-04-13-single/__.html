<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8">
<title>  </title>
<style>
/* 标签实际打印尺寸：80mm × 50mm */
@page { size: 80mm 50mm; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 80mm; height: 50mm;
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 7pt;
  background: white;
  overflow: hidden;
}
.label {
  width: 80mm; height: 50mm;
  display: flex;
  flex-direction: column;
  border: 0.3mm solid #ddd;
}

/* ── 顶部色带（眼别标识）── */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1a6fb5;
  color: white;
  padding: 1mm 2.5mm;
  height: 8mm;
  flex-shrink: 0;
}
.eye-badge {
  font-size: 11pt;
  font-weight: 900;
  letter-spacing: 1px;
}
.brand {
  font-size: 7.5pt;
  font-weight: 700;
  letter-spacing: 1.5px;
  opacity: 0.92;
}
.order-no {
  font-size: 5.5pt;
  opacity: 0.85;
  font-family: monospace;
}

/* ── 主体区域 ── */
.body {
  display: flex;
  flex: 1;
  padding: 1.5mm 2mm 1mm;
  gap: 2mm;
  background: #f0f7ff;
}

/* ── 左侧：文字信息 ── */
.info { flex: 1; display: flex; flex-direction: column; gap: 0.5mm; min-width: 0; }

.customer-row {
  display: flex;
  align-items: baseline;
  gap: 1.5mm;
  border-bottom: 0.2mm solid #1a6fb544;
  padding-bottom: 1mm;
  margin-bottom: 0.5mm;
}
.customer-name {
  font-size: 10pt;
  font-weight: 800;
  color: #1a1a2e;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 28mm;
}
.sku-name {
  font-size: 6.5pt;
  color: #1a6fb5;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ── 处方参数表 ── */
.rx-grid {
  display: grid;
  grid-template-columns: auto auto auto auto auto;
  column-gap: 2.5mm;
  row-gap: 0.3mm;
  margin: 0.5mm 0;
}
.rx-label {
  font-size: 5pt;
  color: #888;
  text-transform: uppercase;
  letter-spacing: 0.3px;
}
.rx-value {
  font-size: 9pt;
  font-weight: 700;
  color: #1a1a2e;
  font-family: "SF Mono", "Consolas", monospace;
  line-height: 1.1;
}
.rx-value.highlight { color: #1a6fb5; }

/* ── 附加信息行 ── */
.meta-row {
  display: flex;
  gap: 2mm;
  margin-top: 0.5mm;
  flex-wrap: wrap;
}
.meta-item {
  display: flex;
  align-items: center;
  gap: 0.8mm;
}
.meta-label { font-size: 5pt; color: #aaa; }
.meta-value { font-size: 6pt; color: #444; font-weight: 600; }

.remark {
  font-size: 5.5pt;
  color: #b7791f;
  background: #fffbeb;
  border-left: 0.8mm solid #f6ad55;
  padding: 0.5mm 1mm;
  margin-top: 0.5mm;
}

/* ── 右侧：QR码 ── */
.qr-col {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 1mm;
  flex-shrink: 0;
}
.qr-col img {
  width: 18mm;
  height: 18mm;
  display: block;
  border: 0.3mm solid #ddd;
  border-radius: 1mm;
}
.qr-label {
  font-size: 4pt;
  color: #bbb;
  text-align: center;
}

/* ── 底部：镜片码条 ── */
.footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #f8f9fa;
  border-top: 0.2mm solid #e9ecef;
  padding: 0.8mm 2.5mm;
  height: 6.5mm;
  flex-shrink: 0;
}
.lens-code {
  font-family: "Courier New", monospace;
  font-size: 6pt;
  font-weight: 700;
  color: #495057;
  letter-spacing: 1px;
}
.footer-meta {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
}
.delivery-badge {
  font-size: 5.5pt;
  font-weight: 700;
  color: white;
  background: #e67e22;
  border-radius: 1mm;
  padding: 0.3mm 1.5mm;
  margin-bottom: 0.3mm;
}
.promise-date { font-size: 5pt; color: #aaa; }
.agent-tag { font-size: 4.5pt; color: #ccc; margin-top: 0.2mm; }
</style></head><body>
