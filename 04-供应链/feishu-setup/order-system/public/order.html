<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>高视高清 · 订单提交</title>
<link rel="stylesheet" href="/css/common.css">
<style>
.patient-card {
  border: 1px solid #e8e8e8;
  border-radius: 10px;
  padding: 16px;
  margin-bottom: 14px;
  background: #fafafa;
  border-left: 3px solid #1677ff;
  position: relative;
}
.patient-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.patient-no { font-size: 14px; font-weight: 600; color: #1677ff; }

.eye-block {
  background: #fff;
  border: 1px solid #e0e7ff;
  border-radius: 8px;
  padding: 12px;
  margin-bottom: 10px;
}
.eye-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 10px;
}
.eye-header input[type="checkbox"] { width: auto; margin: 0; }
.eye-header label {
  font-size: 13px;
  font-weight: 600;
  color: #4f46e5;
  margin: 0;
  cursor: pointer;
}
.eye-fields { transition: opacity 0.2s; }
.eye-fields.disabled { opacity: 0.35; pointer-events: none; }

.rx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.rx-field label { font-size: 11px; color: #888; margin-bottom: 3px; }
.rx-field input { padding: 8px; font-size: 14px; }

.copy-eye-btn {
  background: #f0f7ff; color: #1677ff; border: 1px dashed #91caff;
  padding: 6px 12px; border-radius: 4px; font-size: 12px; cursor: pointer;
  width: 100%; margin-top: 6px;
}
.copy-eye-btn:hover { background: #d6e8ff; }

.excel-upload-btn {
  display: inline-flex; align-items: center; gap: 6px;
  background: #f0f7ff; color: #1677ff; border: 1px solid #91caff;
  padding: 6px 14px; border-radius: 6px; font-size: 13px; cursor: pointer;
  font-weight: 500;
}
.excel-upload-btn:hover { background: #d6e8ff; }
.excel-upload-btn input { display: none; }

.excel-preview-table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
.excel-preview-table th { background: #f5f5f5; padding: 8px 6px; text-align: left; font-weight: 600; border-bottom: 2px solid #e0e0e0; }
.excel-preview-table td { padding: 8px 6px; border-bottom: 1px solid #f0f0f0; }
.excel-preview-table tr:hover td { background: #f8faff; }
.excel-warning { color: #d46b08; font-size: 12px; margin-top: 8px; padding: 8px; background: #fff7e6; border-radius: 6px; }

.submit-bar {
  position: sticky; bottom: 0; background: #fff;
  padding: 12px 16px; box-shadow: 0 -2px 8px rgba(0,0,0,0.08); z-index: 50;
}
</style>
</head>
<body>

<div class="header">
  <h1>高视高清 · 订单提交</h1>
  <div class="agent-name" id="agentName">加载中...</div>
</div>

<div class="nav">
  <a href="#" class="active">下单</a>
  <a href="#" id="navTrack">订单追踪</a>
</div>

<div class="toast" id="toast"></div>

<div class="container">
  <div class="success-page" id="successPage">
    <div class="success-icon">&#10004;&#65039;</div>
    <h2>订单提交成功</h2>
    <p>订单已进入处理流程，系统将自动分配交期。</p>
    <div class="success-detail" id="successDetail"></div>
    <div class="success-actions">
      <button class="btn btn-outline" onclick="resetForm()">再下一单</button>
      <a class="btn btn-primary" id="viewOrderBtn" href="#">查看订单</a>
    </div>
  </div>

  <div id="formPage">
    <div class="card">
      <div class="card-title">收货信息</div>
      <div class="field">
        <label>终端客户 <span class="req">*</span></label>
        <input type="text" id="terminalCustomer" placeholder="选择或输入终端客户名称" list="terminalCustomerList" autocomplete="off" onchange="onTerminalCustomerSelect()">
        <div class="error-tip">请填写终端客户</div>
      </div>
      <div class="field">
        <label>联系人 <span class="req">*</span></label>
        <input type="text" id="contact" placeholder="联系人姓名" autocomplete="off">
        <div class="error-tip">请填写联系人</div>
      </div>
      <div class="field">
        <label>联系电话 <span class="req">*</span></label>
        <input type="text" id="phone" placeholder="手机号码" inputmode="tel" autocomplete="off">
        <div class="error-tip">请填写联系电话</div>
      </div>
      <div class="field">
        <label>收货地址 <span class="req">*</span></label>
        <input type="text" id="address" placeholder="请填写详细收货地址" list="addressList" autocomplete="off">
        <div class="error-tip">请填写收货地址</div>
      </div>
    </div>

    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        顾客订单
        <label class="excel-upload-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
          上传Excel
          <input type="file" accept=".xlsx,.xls" onchange="handleExcelSelect(event)">
        </label>
      </div>
      <div id="patientList"></div>
      <button class="btn btn-outline btn-block" onclick="addPatient()" id="addPatientBtn">＋ 添加顾客</button>
    </div>

    <div class="card" id="summaryCard" style="display:none">
      <div class="card-title">订单摘要</div>
      <div id="summaryContent"></div>
    </div>

    <div class="card">
      <div class="loading" id="loading"><span class="spinner"></span>提交中，请稍候...</div>
      <button class="btn btn-primary btn-lg btn-block" onclick="showConfirm()" id="submitBtn">提交订单</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirmModal">
  <div class="modal">
    <div class="modal-header">
      <h2>确认提交</h2>
      <button class="modal-close" onclick="closeConfirm()">&times;</button>
    </div>
    <div class="confirm-summary" id="confirmSummary"></div>
    <button class="btn btn-success btn-lg btn-block" onclick="doSubmit()" id="confirmBtn">确认提交</button>
  </div>
</div>

<div class="modal-overlay" id="excelModal">
  <div class="modal" style="max-width:640px">
    <div class="modal-header">
      <h2>Excel 解析结果</h2>
      <button class="modal-close" onclick="closeExcelModal()">&times;</button>
    </div>
    <div id="excelPreviewContent"></div>
    <button class="btn btn-primary btn-lg btn-block" onclick="importToForm()" id="excelImportBtn">导入表单</button>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get("t") || "";
let agentInfo = null;
let SKU_OPTIONS = []; // 从 API 动态加载
let customerNames = [];
let terminalCustomers = []; // 终端客户列表 [{id,name,contact,phone,address}]
let patientCount = 0;
let estimateTimers = {};
let excelParsedPatients = null; // 暂存 Excel 解析结果

async function init() {
  if (!token) {
    document.getElementById("agentName").textContent = "无效访问";
    showToast("请通过代理商专属链接访问", "error");
    return;
  }

  document.getElementById("navTrack").href = `/track?t=${token}`;
  document.getElementById("viewOrderBtn").href = `/track?t=${token}`;

  try {
    const agentRes = await fetch(`/api/agent?t=${token}`);
    if (!agentRes.ok) throw new Error();
    agentInfo = await agentRes.json();
    document.getElementById("agentName").textContent = agentInfo.name;
  } catch {
    document.getElementById("agentName").textContent = "验证失败";
    showToast("链接无效或已过期", "error");
    return;
  }

  // 加载产品目录
  try {
    const skuRes = await fetch(`/api/skus?models&t=${token}`);
    if (skuRes.ok) {
      SKU_OPTIONS = (await skuRes.json()).map(s => ({
        value: s.sku,
        label: s.name || s.sku,
        status: s.statusLabel,
      }));
      const order = { "有货": 0, "低库存": 1, "缺货": 2, "定制": 3 };
      SKU_OPTIONS.sort((a, b) => (order[a.status] ?? 9) - (order[b.status] ?? 9));
    }
  } catch (e) { console.error("SKU加载失败:", e); }

  if (SKU_OPTIONS.length === 0) {
    showToast("产品列表加载失败，请刷新重试", "error");
    return;
  }

  try {
    const custRes = await fetch(`/api/customers?t=${token}`);
    if (custRes.ok) {
      const custData = await custRes.json();
      customerNames = custData.customers || [];
    }
  } catch (e) { console.error("客户数据加载失败:", e); }

  // 加载终端客户（含联系人/电话/地址）
  try {
    const tcRes = await fetch(`/api/terminal-customers?t=${token}`);
    if (tcRes.ok) {
      const tcData = await tcRes.json();
      terminalCustomers = tcData.customers || [];
    }
  } catch (e) { console.error("终端客户数据加载失败:", e); }

  renderCustomerDatalist();
  renderTerminalCustomerDatalist();
  renderAddressDatalist();
  addPatient();
}

function renderCustomerDatalist() {
  let dl = document.getElementById("customerList");
  if (!dl) {
    dl = document.createElement("datalist");
    dl.id = "customerList";
    document.body.appendChild(dl);
  }
  dl.innerHTML = customerNames.map(n => `<option value="${n}">`).join("");
}

function renderTerminalCustomerDatalist() {
  let dl = document.getElementById("terminalCustomerList");
  if (!dl) {
    dl = document.createElement("datalist");
    dl.id = "terminalCustomerList";
    document.body.appendChild(dl);
  }
  dl.innerHTML = terminalCustomers.map(c => `<option value="${c.name}">`).join("");
}

function renderAddressDatalist() {
  let dl = document.getElementById("addressList");
  if (!dl) {
    dl = document.createElement("datalist");
    dl.id = "addressList";
    document.body.appendChild(dl);
  }
  const addrs = [...new Set(terminalCustomers.filter(c => c.address).map(c => c.address))];
  dl.innerHTML = addrs.map(a => `<option value="${a}">`).join("");
}

function onTerminalCustomerSelect() {
  const name = document.getElementById("terminalCustomer").value.trim();
  const tc = terminalCustomers.find(c => c.name === name);
  if (!tc) return;
  if (tc.contact) document.getElementById("contact").value = tc.contact;
  if (tc.phone) document.getElementById("phone").value = tc.phone;
  if (tc.address) document.getElementById("address").value = tc.address;
}

function renderSkuOptions() {
  let html = '<option value="">请选择产品型号</option>';
  for (const s of SKU_OPTIONS) {
    const badge = s.status === '有货' ? ' ✓' : s.status === '定制' ? ' (定制)' : s.status === '低库存' ? ' (低库存)' : '';
    html += `<option value="${s.value}">${s.label}${badge}</option>`;
  }
  return html;
}

function addPatient() {
  if (patientCount >= 20) { showToast("最多添加 20 位顾客", "error"); return; }
  patientCount++;
  const id = patientCount;
  const skuOptions = renderSkuOptions();

  const div = document.createElement("div");
  div.className = "patient-card";
  div.id = `patient-${id}`;
  div.innerHTML = `
    <div class="patient-header">
      <span class="patient-no">顾客 ${id}</span>
      ${id > 1 ? `<button class="btn-danger" onclick="removePatient(${id})">✕ 删除</button>` : ""}
    </div>
    <div class="field">
      <label>顾客姓名 <span class="req">*</span></label>
      <input type="text" id="name-${id}" placeholder="请输入顾客姓名" list="customerList" autocomplete="off">
      <div class="error-tip">请填写顾客姓名</div>
    </div>
    <div class="field">
      <label>产品型号 <span class="req">*</span></label>
      <select id="sku-${id}" onchange="onSkuChange(${id})">${skuOptions}</select>
      <div class="error-tip">请选择产品型号</div>
    </div>
    <div class="field">
      <label>数量 <span class="req">*</span></label>
      <input type="number" id="qty-${id}" min="1" max="100" value="1" inputmode="numeric" onchange="onQtyChange(${id})" oninput="onQtyChange(${id})">
      <div class="error-tip">数量需在 1-100 之间</div>
    </div>
    <div class="delivery-estimate" id="estimate-${id}"></div>

    <div class="eye-block">
      <div class="eye-header">
        <input type="checkbox" id="eye-check-${id}-right" checked onchange="toggleEye(${id},'right')">
        <label for="eye-check-${id}-right">右眼</label>
      </div>
      <div class="eye-fields" id="eye-fields-${id}-right">
        <div class="rx-grid">
          <div class="rx-field"><label>球镜 SPH</label><input type="number" step="0.25" id="sph-${id}-right" placeholder="-2.75" inputmode="decimal"></div>
          <div class="rx-field"><label>柱镜 CYL</label><input type="number" step="0.25" id="cyl-${id}-right" placeholder="-1.00" inputmode="decimal"></div>
        </div>
        <div class="rx-grid" style="margin-top:8px">
          <div class="rx-field"><label>轴位 AXIS</label><input type="number" min="0" max="180" step="1" id="axis-${id}-right" placeholder="0-180" inputmode="numeric"></div>
          <div class="rx-field"></div>
        </div>
      </div>
    </div>

    <div class="eye-block">
      <div class="eye-header">
        <input type="checkbox" id="eye-check-${id}-left" checked onchange="toggleEye(${id},'left')">
        <label for="eye-check-${id}-left">左眼</label>
      </div>
      <div class="eye-fields" id="eye-fields-${id}-left">
        <div class="rx-grid">
          <div class="rx-field"><label>球镜 SPH</label><input type="number" step="0.25" id="sph-${id}-left" placeholder="-2.75" inputmode="decimal"></div>
          <div class="rx-field"><label>柱镜 CYL</label><input type="number" step="0.25" id="cyl-${id}-left" placeholder="-1.00" inputmode="decimal"></div>
        </div>
        <div class="rx-grid" style="margin-top:8px">
          <div class="rx-field"><label>轴位 AXIS</label><input type="number" min="0" max="180" step="1" id="axis-${id}-left" placeholder="0-180" inputmode="numeric"></div>
          <div class="rx-field"></div>
        </div>
      </div>
    </div>

    <div style="margin-top:4px">
      <label style="font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" id="assembly-${id}" checked style="width:auto;margin:0"> 是否装配
      </label>
    </div>
    <div class="field" style="margin-top:8px">
      <label>备注（选填）</label>
      <textarea id="remark-${id}" rows="1" placeholder="该顾客的特殊要求"></textarea>
    </div>

    <button class="copy-eye-btn" onclick="copyEye(${id},'right','left')">← 复制右眼到左眼</button>
  `;
  document.getElementById("patientList").appendChild(div);
}

function removePatient(id) {
  document.getElementById(`patient-${id}`)?.remove();
  updateSummary();
}

function toggleEye(id, side) {
  const checked = document.getElementById(`eye-check-${id}-${side}`).checked;
  document.getElementById(`eye-fields-${id}-${side}`).classList.toggle("disabled", !checked);
}

function copyEye(id, from, to) {
  for (const f of ["sph", "cyl", "axis"]) {
    const src = document.getElementById(`${f}-${id}-${from}`);
    const dst = document.getElementById(`${f}-${id}-${to}`);
    if (src && dst) dst.value = src.value;
  }
  const check = document.getElementById(`eye-check-${id}-${to}`);
  if (check && !check.checked) { check.checked = true; toggleEye(id, to); }
  showToast("已复制右眼处方到左眼", "info");
}

// ─── 交期预估 ──────────────────────────────────────────────────────────────
function onSkuChange(id) { debouncedEstimate(id); }
function onQtyChange(id) { debouncedEstimate(id); }

function debouncedEstimate(id) {
  clearTimeout(estimateTimers[id]);
  estimateTimers[id] = setTimeout(() => fetchEstimate(id), 300);
}

async function fetchEstimate(id) {
  const sku = document.getElementById(`sku-${id}`)?.value;
  const qty = Number(document.getElementById(`qty-${id}`)?.value) || 0;
  const el = document.getElementById(`estimate-${id}`);
  if (!sku || qty <= 0) { el.className = "delivery-estimate"; return; }

  el.innerHTML = '<span class="spinner" style="width:14px;height:14px;border-width:2px;vertical-align:middle"></span>';
  el.className = "delivery-estimate show";

  try {
    const res = await fetch(`/api/delivery-estimate?t=${token}&sku=${encodeURIComponent(sku)}&qty=${qty}`);
    if (!res.ok) return;
    const data = await res.json();
    const cls = data.available ? "instock" : "custom";
    el.innerHTML = `<span class="badge badge-${cls === 'instock' ? 'instock' : 'custom'}">${data.deliveryType}</span> 预计 ${data.promiseDateFormatted} 交付`;
    el.className = `delivery-estimate show ${cls}`;
    updateSummary();
  } catch {}
}

// ─── 订单摘要 ──────────────────────────────────────────────────────────────
function updateSummary() {
  const patients = collectPatients();
  const card = document.getElementById("summaryCard");
  const content = document.getElementById("summaryContent");
  if (patients.length === 0) { card.style.display = "none"; return; }

  card.style.display = "";
  let totalLenses = 0, html = "";
  for (const p of patients) {
    totalLenses += p.eyes.length;
    const estEl = document.getElementById(`estimate-${p.id}`);
    const estBadge = estEl ? estEl.innerHTML : "";
    html += `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f5f5f5;font-size:14px">
      <span><strong>${p.customerName}</strong> · ${p.sku} × ${p.eyes.length}片</span>
      ${estBadge ? `<span style="font-size:12px">${estBadge}</span>` : ""}
    </div>`;
  }
  html += `<div style="padding:10px 0 0;font-size:14px;color:#666;text-align:right">共 ${patients.length} 位顾客，${totalLenses} 片镜片</div>`;
  content.innerHTML = html;
}

// ─── 收集数据 ──────────────────────────────────────────────────────────────
function collectPatients() {
  const cards = document.querySelectorAll(".patient-card");
  const patients = [];
  for (const card of cards) {
    const id = card.id.replace("patient-", "");
    const name = document.getElementById(`name-${id}`)?.value.trim();
    const sku = document.getElementById(`sku-${id}`)?.value;
    const quantity = Number(document.getElementById(`qty-${id}`)?.value) || 0;
    if (!name || !sku) continue;

    const eyes = [];
    for (const [side, label] of [["right", "右眼"], ["left", "左眼"]]) {
      if (!document.getElementById(`eye-check-${id}-${side}`)?.checked) continue;
      eyes.push({
        side: label,
        sph: document.getElementById(`sph-${id}-${side}`)?.value || "0",
        cyl: document.getElementById(`cyl-${id}-${side}`)?.value || "0",
        axis: document.getElementById(`axis-${id}-${side}`)?.value || "0",
      });
    }
    const assembly = document.getElementById(`assembly-${id}`)?.checked !== false;
    const remark = document.getElementById(`remark-${id}`)?.value.trim() || "";
    if (eyes.length > 0) patients.push({ id, customerName: name, sku, quantity, eyes, assembly, remark });
  }
  return patients;
}

// ─── 验证 ──────────────────────────────────────────────────────────────────
function validate() {
  let valid = true;

  const tc = document.getElementById("terminalCustomer");
  if (!tc.value.trim()) { tc.classList.add("error"); valid = false; } else tc.classList.remove("error");

  const contact = document.getElementById("contact");
  if (!contact.value.trim()) { contact.classList.add("error"); valid = false; } else contact.classList.remove("error");

  const phone = document.getElementById("phone");
  if (!phone.value.trim()) { phone.classList.add("error"); valid = false; } else phone.classList.remove("error");

  const addr = document.getElementById("address");
  if (!addr.value.trim()) { addr.classList.add("error"); valid = false; }
  else addr.classList.remove("error");

  const patients = collectPatients();
  if (patients.length === 0) { showToast("请至少填写一位顾客的完整信息", "error"); return false; }

  for (const card of document.querySelectorAll(".patient-card")) {
    const id = card.id.replace("patient-", "");
    const nameEl = document.getElementById(`name-${id}`);
    const skuEl = document.getElementById(`sku-${id}`);
    if (!nameEl?.value.trim()) { nameEl?.classList.add("error"); valid = false; } else nameEl?.classList.remove("error");
    if (!skuEl?.value) { skuEl?.classList.add("error"); valid = false; } else skuEl?.classList.remove("error");

    const r = document.getElementById(`eye-check-${id}-right`);
    const l = document.getElementById(`eye-check-${id}-left`);
    if (!r?.checked && !l?.checked) { showToast(`顾客 ${id}：请至少勾选一只眼睛`, "error"); valid = false; }
  }
  return valid;
}

// ─── 确认弹窗 ──────────────────────────────────────────────────────────────
function showConfirm() {
  if (!validate()) return;
  const patients = collectPatients();
  let totalLenses = 0;
  let html = '<div class="confirm-summary">';
  html += `<div class="row"><span class="label">收货地址</span><span class="value">${document.getElementById("address").value.trim()}</span></div>`;
  for (const p of patients) {
    totalLenses += p.eyes.length;
    const estEl = document.getElementById(`estimate-${p.id}`);
    html += `<div class="row"><span class="label">${p.customerName} · ${p.sku} × ${p.eyes.length}片</span><span class="value">${estEl ? estEl.textContent.trim() : ''}</span></div>`;
  }
  html += `<div class="row" style="font-weight:600;border-top:2px solid #eee;padding-top:12px"><span>合计</span><span>${patients.length} 位顾客，${totalLenses} 片镜片</span></div></div>`;
  document.getElementById("confirmSummary").innerHTML = html;
  document.getElementById("confirmModal").classList.add("show");
}

function closeConfirm() { document.getElementById("confirmModal").classList.remove("show"); }

// ─── 提交 ──────────────────────────────────────────────────────────────────
async function doSubmit() {
  closeConfirm();
  const patients = collectPatients();
  const address = document.getElementById("address").value.trim();
  const tcName = document.getElementById("terminalCustomer").value.trim();
  const contact = document.getElementById("contact").value.trim();
  const phone = document.getElementById("phone").value.trim();

  document.getElementById("submitBtn").disabled = true;
  document.getElementById("loading").style.display = "block";

  try {
    const body = {
      address,
      patients: patients.map(p => ({ customerName: p.customerName, sku: p.sku, quantity: p.quantity, eyes: p.eyes, assembly: p.assembly, remark: p.remark })),
    };
    if (tcName || contact || phone) {
      body.terminalCustomer = { name: tcName, contact, phone, address };
    }

    const res = await fetch(`/api/submit?t=${token}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const json = await res.json();

    if (json.success) {
      document.getElementById("formPage").style.display = "none";
      let d = '<div style="text-align:left;font-size:14px;margin-bottom:16px"><div style="margin-bottom:8px"><strong>订单号：</strong>' + json.orderNo + '</div>';
      for (const item of json.items) {
        d += `<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #d9f7be;font-size:13px">
          <span>${item.skuName} × ${item.quantity}</span>
          <span class="badge badge-${item.deliveryType.startsWith('有货') ? 'instock' : 'custom'}">${item.deliveryType} · ${item.promiseDateFormatted}</span>
        </div>`;
      }
      d += '</div>';
      document.getElementById("successDetail").innerHTML = d;
      document.getElementById("successPage").style.display = "block";
    } else {
      showToast(json.error || "提交失败，请重试", "error");
    }
  } catch {
    showToast("网络错误，请重试", "error");
  } finally {
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("loading").style.display = "none";
  }
}

function resetForm() {
  document.getElementById("terminalCustomer").value = "";
  document.getElementById("contact").value = "";
  document.getElementById("phone").value = "";
  document.getElementById("address").value = "";
  document.getElementById("patientList").innerHTML = "";
  document.getElementById("summaryCard").style.display = "none";
  patientCount = 0;
  document.getElementById("successPage").style.display = "none";
  document.getElementById("formPage").style.display = "block";
  addPatient();
}

function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast ${type}`;
  el.style.display = "block";
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.style.display = "none", 3000);
}

document.getElementById("address")?.addEventListener("input", function() { this.classList.remove("error"); });
document.getElementById("terminalCustomer")?.addEventListener("input", function() { this.classList.remove("error"); });
document.getElementById("contact")?.addEventListener("input", function() { this.classList.remove("error"); });
document.getElementById("phone")?.addEventListener("input", function() { this.classList.remove("error"); });

// ─── Excel 解析 ──────────────────────────────────────────────────────────
async function handleExcelSelect(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = ""; // 允许重复选同一文件

  if (file.size > 5 * 1024 * 1024) { showToast("文件过大，请限制在 5MB 以内", "error"); return; }

  showToast("正在解析 Excel...", "info");

  try {
    const base64 = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result.split(",")[1]);
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });

    const res = await fetch(`/api/excel-parse?t=${token}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ file: { name: file.name, mimeType: file.type, data: base64 } }),
    });
    const json = await res.json();

    if (json.patients && json.patients.length > 0) {
      excelParsedPatients = json.patients;
      renderExcelPreview(json.patients, json.warnings || []);
      document.getElementById("excelModal").classList.add("show");
    } else {
      showToast("未能从 Excel 中解析出处方数据", "error");
      if (json.warnings?.length) showToast(json.warnings[0], "error");
    }
  } catch (e) {
    showToast("解析失败: " + e.message, "error");
  }
}

function renderExcelPreview(patients, warnings) {
  let html = `<div style="font-size:14px;color:#666;margin-bottom:8px">共解析 <strong>${patients.length}</strong> 位患者</div>`;
  html += '<table class="excel-preview-table"><thead><tr><th>患者</th><th>SKU</th><th>右眼 SPH/CYL/AXIS</th><th>左眼 SPH/CYL/AXIS</th></tr></thead><tbody>';
  for (const p of patients) {
    const rEye = p.eyes?.find(e => e.side === "右眼") || {};
    const lEye = p.eyes?.find(e => e.side === "左眼") || {};
    html += `<tr>
      <td><strong>${p.customerName || "-"}</strong></td>
      <td>${p.sku || "-"}</td>
      <td>${rEye.sph || "0"} / ${rEye.cyl || "0"} / ${rEye.axis || "0"}</td>
      <td>${lEye.sph || "0"} / ${lEye.cyl || "0"} / ${lEye.axis || "0"}</td>
    </tr>`;
  }
  html += '</tbody></table>';
  if (warnings.length) {
    html += '<div class="excel-warning">' + warnings.map(w => "- " + w).join("<br>") + '</div>';
  }
  document.getElementById("excelPreviewContent").innerHTML = html;
}

function importToForm() {
  if (!excelParsedPatients) return;
  closeExcelModal();

  // 清空现有卡片
  document.getElementById("patientList").innerHTML = "";
  patientCount = 0;

  for (const p of excelParsedPatients) {
    addPatient();
    const id = patientCount;
    const nameEl = document.getElementById(`name-${id}`);
    const skuEl = document.getElementById(`sku-${id}`);
    const qtyEl = document.getElementById(`qty-${id}`);
    if (nameEl) nameEl.value = p.customerName || "";
    if (skuEl) skuEl.value = p.sku || "";
    if (qtyEl) qtyEl.value = p.quantity || 1;

    if (p.eyes) {
      for (const eye of p.eyes) {
        const side = eye.side === "右眼" ? "right" : "left";
        const sphEl = document.getElementById(`sph-${id}-${side}`);
        const cylEl = document.getElementById(`cyl-${id}-${side}`);
        const axisEl = document.getElementById(`axis-${id}-${side}`);
        const checkEl = document.getElementById(`eye-check-${id}-${side}`);
        if (sphEl) sphEl.value = eye.sph || "0";
        if (cylEl) cylEl.value = eye.cyl || "0";
        if (axisEl) axisEl.value = eye.axis || "0";
        if (checkEl && !checkEl.checked) { checkEl.checked = true; toggleEye(id, side); }
      }
    }

    const assemblyEl = document.getElementById(`assembly-${id}`);
    if (assemblyEl) assemblyEl.checked = p.assembly !== false;
    const remarkEl = document.getElementById(`remark-${id}`);
    if (remarkEl && p.remark) remarkEl.value = p.remark;

    debouncedEstimate(id);
  }

  updateSummary();
  showToast(`已导入 ${excelParsedPatients.length} 位患者处方`, "success");
  excelParsedPatients = null;
}

function closeExcelModal() { document.getElementById("excelModal").classList.remove("show"); }

init();</script>
