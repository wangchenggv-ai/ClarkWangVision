<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高视高清 · 订单追踪</title>
<link rel="stylesheet" href="/css/common.css">
<style>
@media (max-width: 600px) {
  .hide-mobile { display: none; }
}
</style>
</head>
<body>

<div class="header">
  <div class="brand-logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/>
    </svg>
    <span class="gaush">GAUSH</span>
    <span class="sep">|</span>
    <span class="clear">CLEAR</span>
  </div>
  <h1>订单追踪</h1>
  <div class="agent-name" id="agentName">加载中...</div>
</div>

<div class="nav">
  <a href="#" id="navOrder">下单</a>
  <a href="#" class="active">订单追踪</a>
</div>

<div class="toast" id="toast"></div>

<!-- 统计栏 -->
<div class="stats-bar" id="statsBar">
  <div class="stat-item"><div class="stat-value" id="statTotal">-</div><div class="stat-label">总订单</div></div>
  <div class="stat-item"><div class="stat-value" id="statPending">-</div><div class="stat-label">待处理</div></div>
  <div class="stat-item"><div class="stat-value" id="statProducing">-</div><div class="stat-label">生产中</div></div>
  <div class="stat-item"><div class="stat-value" id="statShipped">-</div><div class="stat-label">已发货</div></div>
  <div class="stat-item"><div class="stat-value" id="statReceived">-</div><div class="stat-label">已签收</div></div>
</div>

<!-- 筛选栏 -->
<div class="filter-bar">
  <input type="text" class="search-input" id="searchInput" placeholder="搜订单号或顾客姓名" oninput="filterLocal()">
  <select id="filterStatus" onchange="filterLocal()">
    <option value="">全部状态</option>
    <option value="待处理">待处理</option>
    <option value="生产中">生产中</option>
    <option value="已发货">已发货</option>
    <option value="已签收">已签收</option>
  </select>
  <select id="filterSku">
    <option value="">全部SKU</option>
  </select>
  <input type="date" id="filterFrom" placeholder="开始日期">
  <input type="date" id="filterTo" placeholder="结束日期">
  <button class="btn btn-outline" onclick="loadOrders()" style="padding:6px 12px;font-size:13px;min-height:auto">查询</button>
  <button class="btn btn-text" onclick="exportCsv()" style="margin-left:auto">📥 导出CSV</button>
</div>

<div class="container" style="padding-top:0">
  <div class="loading" id="loading"><span class="spinner"></span>加载中...</div>
  <div class="empty" id="empty" style="display:none">暂无订单记录</div>
  <div id="orderList"></div>

  <!-- 分页 -->
  <div class="pagination" id="pagination" style="display:none">
    <button id="prevBtn" onclick="changePage(-1)">上一页</button>
    <span class="page-info" id="pageInfo"></span>
    <button id="nextBtn" onclick="changePage(1)">下一页</button>
  </div>
</div>

<!-- 详情弹窗 -->
<div class="modal-overlay" id="detailModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="detailTitle">订单详情</h2>
      <button class="modal-close" onclick="closeDetail()">&times;</button>
    </div>
    <div id="detailContent"></div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get("t") || "";
let currentPage = 1;
const pageSize = 20;
let allOrdersData = []; // 缓存当前页数据用于本地搜索

// ─── 状态 Badge 映射 ────────────────────────────────────────────────────────
function statusBadge(status) {
  const map = {
    "待处理": "badge-pending",
    "待人工审核": "badge-review",
    "生产中": "badge-producing",
    "已发货": "badge-shipped",
    "已签收": "badge-received",
    "完成": "badge-done",
  };
  return `<span class="badge ${map[status] || 'badge-pending'}">${status || '未知'}</span>`;
}

function formatDate(ts) {
  if (!ts) return "-";
  return new Date(ts).toLocaleDateString("zh-CN", { year: "numeric", month: "2-digit", day: "2-digit" });
}

// ─── 初始化 ──────────────────────────────────────────────────────────────────
async function init() {
  if (!token) {
    document.getElementById("agentName").textContent = "无效访问";
    return;
  }

  document.getElementById("navOrder").href = `/order?t=${token}`;

  // 并行：代理商验证 + SKU列表 + 订单列表
  const agentPromise = fetch(`/api/agent?t=${token}`);
  const skusPromise = fetch(`/api/skus?t=${token}`);

  // 代理商验证（必须成功才继续）
  try {
    const res = await agentPromise;
    if (!res.ok) throw new Error();
    const info = await res.json();
    document.getElementById("agentName").textContent = info.name;
  } catch {
    document.getElementById("agentName").textContent = "验证失败";
    return;
  }

  // 订单加载不等 SKU，立即开始
  loadOrders();

  // SKU 筛选器后台加载
  skusPromise.then(res => {
    if (res.ok) return res.json();
  }).then(skus => {
    if (!skus) return;
    const sel = document.getElementById("filterSku");
    for (const s of skus) {
      const opt = document.createElement("option");
      opt.value = s.sku;
      opt.textContent = `${s.sku} ${s.name}`;
      sel.appendChild(opt);
    }
  }).catch(() => {});
}

// ─── 加载订单 ──────────────────────────────────────────────────────────────
async function loadOrders() {
  const loading = document.getElementById("loading");
  const empty = document.getElementById("empty");
  const orderList = document.getElementById("orderList");

  loading.style.display = "block";
  empty.style.display = "none";
  orderList.innerHTML = "";

  const params = new URLSearchParams({ t: token, page: currentPage, pageSize });
  const status = document.getElementById("filterStatus").value;
  const sku = document.getElementById("filterSku").value;
  const from = document.getElementById("filterFrom").value;
  const to = document.getElementById("filterTo").value;
  if (status) params.set("status", status);
  if (sku) params.set("sku", sku);
  if (from) params.set("from", from);
  if (to) params.set("to", to);

  try {
    const res = await fetch(`/api/orders?${params}`);
    if (!res.ok) throw new Error();
    const data = await res.json();

    loading.style.display = "none";

    // 更新统计（修复：生产中+已签收）
    document.getElementById("statTotal").textContent = data.stats.total;
    document.getElementById("statPending").textContent = data.stats.pending;
    document.getElementById("statProducing").textContent = data.stats.producing;
    document.getElementById("statShipped").textContent = data.stats.shipped;
    document.getElementById("statReceived").textContent = data.stats.received;

    allOrdersData = data.orders || [];

    if (allOrdersData.length === 0) {
      empty.style.display = "block";
      document.getElementById("pagination").style.display = "none";
      return;
    }

    renderOrderList(allOrdersData);

    // 分页
    const pagination = document.getElementById("pagination");
    if (data.totalPages > 1) {
      pagination.style.display = "flex";
      document.getElementById("pageInfo").textContent = `${data.page} / ${data.totalPages}（共${data.totalFiltered}条）`;
      document.getElementById("prevBtn").disabled = data.page <= 1;
      document.getElementById("nextBtn").disabled = data.page >= data.totalPages;
    } else {
      pagination.style.display = "none";
    }

  } catch (e) {
    loading.style.display = "none";
    empty.style.display = "block";
    empty.textContent = "加载失败，请刷新重试";
    console.error(e);
  }
}

// ─── 渲染订单列表 ────────────────────────────────────────────────────────
function renderOrderList(orders) {
  const orderList = document.getElementById("orderList");
  const empty = document.getElementById("empty");

  if (orders.length === 0) {
    orderList.innerHTML = "";
    empty.style.display = "block";
    return;
  }
  empty.style.display = "none";

  // 按订单编号分组
  const groups = {};
  for (const o of orders) {
    const key = o.orderNo || "unknown";
    if (!groups[key]) groups[key] = [];
    groups[key].push(o);
  }

  const now = Date.now();
  let html = "";
  for (const [orderNo, items] of Object.entries(groups)) {
    const date = formatDate(items[0].date);

    html += `<div class="order-group" onclick="showDetail('${orderNo}')">
      <div class="order-group-header">
        <span class="order-no">${orderNo}</span>
        <span class="meta">${date} · ${items.length}片</span>
      </div>
      <div class="order-group-body">`;

    for (const item of items) {
      html += `<div class="order-item">
        <div class="left">
          <span class="customer">${item.customerName || '-'}</span>
          <span class="sku-info">${item.sku} × ${item.quantity}</span>
        </div>
        <div class="right">
          ${statusBadge(item.status)}
        </div>
      </div>`;
    }

    html += `</div></div>`;
  }

  orderList.innerHTML = html;
}

// ─── 本地搜索 ──────────────────────────────────────────────────────────────
function filterLocal() {
  const search = document.getElementById("searchInput").value.trim().toLowerCase();
  if (!search) {
    renderOrderList(allOrdersData);
    return;
  }
  const filtered = allOrdersData.filter(o =>
    o.orderNo.toLowerCase() === search ||
    (o.customerName || "").toLowerCase().includes(search)
  );
  renderOrderList(filtered);
}

// ─── 分页 ──────────────────────────────────────────────────────────────────
function changePage(delta) {
  currentPage += delta;
  if (currentPage < 1) currentPage = 1;
  loadOrders();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// ─── 订单详情 ──────────────────────────────────────────────────────────────
async function showDetail(orderNo) {
  const modal = document.getElementById("detailModal");
  const content = document.getElementById("detailContent");

  content.innerHTML = '<div class="loading"><span class="spinner"></span>加载中...</div>';
  modal.classList.add("show");

  try {
    const res = await fetch(`/api/order/${encodeURIComponent(orderNo)}?t=${token}`);
    if (!res.ok) throw new Error();
    const data = await res.json();

    document.getElementById("detailTitle").textContent = `订单 ${data.orderNo}`;

    let html = `<div style="margin-bottom:16px;font-size:14px">`;
    html += `<div style="margin-bottom:6px"><strong>下单时间：</strong>${formatDate(data.date)}</div>`;
    html += `<div style="margin-bottom:6px"><strong>收货地址：</strong>${data.address || '-'}</div>`;
    html += `<div style="margin-bottom:6px"><strong>订单状态：</strong>${statusBadge(data.status)}</div>`;
    html += `</div>`;

    // 物流信息
    if (data.trackingNo) {
      html += `<div class="logistics-info">`;
      html += `<div style="font-size:13px;color:#666;margin-bottom:8px;font-weight:600">物流信息</div>`;
      html += `<div class="row"><span class="label">物流公司</span><span class="value">${data.courier || '-'}</span></div>`;
      html += `<div class="row"><span class="label">快递单号</span><span class="value">${data.trackingNo} <button class="copy-btn" onclick="event.stopPropagation();copyTrackingNo('${data.trackingNo}')">复制</button></span></div>`;
      if (data.shipTime) {
        html += `<div class="row"><span class="label">发货时间</span><span class="value">${formatDate(data.shipTime)}</span></div>`;
      }
      html += `</div>`;
    }

    html += `<table class="detail-table">
      <thead><tr>
        <th>顾客</th><th>SKU</th><th>眼别</th>
        <th>SPH</th><th>CYL</th><th>AXIS</th>
        <th>备注</th>
      </tr></thead><tbody>`;

    const sortedItems = [...data.items].sort((a, b) => {
      const nc = (a.customerName || "").localeCompare(b.customerName || "", "zh-CN");
      if (nc !== 0) return nc;
      return (a.eye?.includes("右") ? 0 : 1) - (b.eye?.includes("右") ? 0 : 1);
    });
    for (const item of sortedItems) {
      const eyeBadge = item.eye?.includes("右")
        ? '<span style="background:#fff1f0;color:#cf1322;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600">右</span>'
        : item.eye?.includes("左")
        ? '<span style="background:#e6f7ff;color:#096dd9;padding:2px 8px;border-radius:3px;font-size:11px;font-weight:600">左</span>'
        : item.eye || '-';
      html += `<tr>
        <td>${item.customerName || '-'}</td>
        <td>${item.sku}</td>
        <td>${eyeBadge}</td>
        <td>${item.sph != null ? Number(item.sph).toFixed(2) : '-'}</td>
        <td>${item.cyl != null ? Number(item.cyl).toFixed(2) : '-'}</td>
        <td>${item.axis ?? '-'}</td>
        <td>${item.remark || '-'}</td>
      </tr>`;
    }

    html += `</tbody></table>`;

    content.innerHTML = html;

  } catch {
    content.innerHTML = '<div class="empty">加载失败</div>';
  }
}

function closeDetail() {
  document.getElementById("detailModal").classList.remove("show");
}

// 点击遮罩关闭
document.getElementById("detailModal").addEventListener("click", function(e) {
  if (e.target === this) closeDetail();
});

// ─── 确认订单 ──────────────────────────────────────────────────────────────
async function confirmOrder(orderNo) {
  const btn = document.getElementById("confirmBtn");
  if (!btn) return;
  btn.disabled = true;
  btn.textContent = "生成中...";

  try {
    const res = await fetch(`/api/order/${encodeURIComponent(orderNo)}/confirm?t=${token}`, {
      method: "POST",
    });
    const data = await res.json();
    if (data.success) {
      showToast(`已生成 ${data.lensCodes.length} 个镜片码`, "success");
      btn.textContent = "已确认";
      btn.className = "btn btn-outline";
      btn.disabled = true;
      // 刷新列表
      loadOrders();
      // 重新打开详情展示 QR
      setTimeout(() => showDetail(orderNo), 500);
    } else {
      showToast(data.error || "确认失败", "error");
      btn.disabled = false;
      btn.textContent = "确认订单";
    }
  } catch {
    showToast("网络错误", "error");
    btn.disabled = false;
    btn.textContent = "确认订单";
  }
}

// ─── 复制快递单号 ──────────────────────────────────────────────────────
function copyTrackingNo(no) {
  navigator.clipboard.writeText(no).then(() => {
    showToast("已复制快递单号", "success");
  }).catch(() => {
    // fallback
    const ta = document.createElement("textarea");
    ta.value = no;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    showToast("已复制快递单号", "success");
  });
}

// ─── CSV 导出 ──────────────────────────────────────────────────────────────
function exportCsv() {
  const params = new URLSearchParams({ t: token });
  const status = document.getElementById("filterStatus").value;
  const sku = document.getElementById("filterSku").value;
  const from = document.getElementById("filterFrom").value;
  const to = document.getElementById("filterTo").value;
  if (status) params.set("status", status);
  if (sku) params.set("sku", sku);
  if (from) params.set("from", from);
  if (to) params.set("to", to);

  showToast("正在导出...", "info");

  fetch(`/api/orders/export?${params}`)
    .then(res => { if (!res.ok) throw new Error(`HTTP ${res.status}`); return res.blob(); })
    .then(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `orders-${new Date().toISOString().slice(0,10)}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      showToast("导出成功", "success");
    })
    .catch(() => showToast("导出失败", "error"));
}

// ─── Toast ──────────────────────────────────────────────────────────────────
function showToast(msg, type = "success") {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.className = `toast ${type}`;
  el.style.display = "block";
  clearTimeout(el._timer);
  el._timer = setTimeout(() => el.style.display = "none", 3000);
}

init();
</script>
</body>
</html>
