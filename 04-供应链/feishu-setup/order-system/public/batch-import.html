<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>高视高清 · 批量赋码</title>
<link rel="stylesheet" href="/css/common.css?v=2">
<style>
.container { max-width: 700px; margin: 0 auto; padding: 20px; }
.status-bar { background: var(--gold-light); border: 1px solid var(--gold); border-radius: var(--radius-sm); padding: 12px 16px; margin-bottom: 16px; font-size: 14px; }

.drop-zone {
  border: 2px dashed var(--border); border-radius: var(--radius);
  padding: 40px; text-align: center; cursor: pointer; transition: all 0.2s;
  background: var(--card); margin-bottom: 16px;
}
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--brand); background: var(--brand-light); }
.drop-zone .icon { font-size: 48px; margin-bottom: 8px; }
.drop-zone .text { font-size: 16px; color: var(--text-muted); }
.drop-zone .sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.file-list { margin-bottom: 16px; }
.file-item {
  display: flex; align-items: center; gap: 8px; padding: 8px 12px;
  background: var(--card); border-radius: var(--radius-xs);
  margin-bottom: 4px; font-size: 13px;
}
.file-item .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-item .remove { cursor: pointer; color: var(--text-muted); padding: 2px 6px; }
.file-item .remove:hover { color: var(--error); }

.btn-primary {
  background: var(--brand); color: #fff; border: none; padding: 10px 28px;
  border-radius: var(--radius-xs); font-size: 15px; font-weight: 600;
  cursor: pointer; transition: background 0.2s;
}
.btn-primary:hover { background: var(--brand-dark); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.msg { padding: 12px 16px; border-radius: var(--radius-sm); margin-top: 16px; font-size: 14px; display: none; }
.msg.ok { background: #e6f9ee; color: #1a7f37; display: block; }
.msg.err { background: #ffebe9; color: #cf222e; display: block; }
</style>
</head>
<body>
<div class="header">
  <div class="brand-logo"><span class="gaush">GAUSH</span><span class="sep">·</span><span class="clear">CLEAR</span></div>
  <h1>批量赋码</h1>
</div>

<div class="container">
  <div class="status-bar">&#9432; 上传 Excel 文件，系统自动识别 SKU 并为每行镜片生成唯一镜片码，导出带码的 Excel。</div>

  <div class="drop-zone" id="dropZone">
    <div class="icon">&#128196;</div>
    <div class="text">拖拽 Excel 文件到此处，或点击选择</div>
    <div class="sub">支持 .xlsx / .xls 格式</div>
  </div>
  <input type="file" id="fileInput" accept=".xlsx,.xls" multiple style="display:none">

  <div class="file-list" id="fileList"></div>

  <button class="btn-primary" id="btnGo" disabled onclick="startAssign()">生成镜片码</button>

  <div class="msg" id="msg"></div>
</div>

<script>
let selectedFiles = [];
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');

dropZone.addEventListener('click', () => fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  addFiles(Array.from(e.dataTransfer.files));
});
fileInput.addEventListener('change', () => {
  addFiles(Array.from(fileInput.files));
  fileInput.value = '';
});

function addFiles(files) {
  const xlsxFiles = files.filter(f => /\.xlsx?$/i.test(f.name));
  selectedFiles = [...selectedFiles, ...xlsxFiles];
  renderFileList();
}

function removeFile(idx) {
  selectedFiles.splice(idx, 1);
  renderFileList();
}

function renderFileList() {
  const el = document.getElementById('fileList');
  if (!selectedFiles.length) { el.innerHTML = ''; document.getElementById('btnGo').disabled = true; return; }
  el.innerHTML = selectedFiles.map((f, i) => `<div class="file-item"><span class="name">${esc(f.name)}</span><span class="remove" onclick="removeFile(${i})">&#10005;</span></div>`).join('');
  document.getElementById('btnGo').disabled = false;
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function startAssign() {
  const btn = document.getElementById('btnGo');
  const msg = document.getElementById('msg');
  btn.disabled = true;
  btn.textContent = '处理中...';
  msg.className = 'msg';
  msg.textContent = '';

  try {
    const filesData = [];
    for (const f of selectedFiles) {
      const data = await readFileAsBase64(f);
      filesData.push({ name: f.name, data: data.split(',')[1] });
    }

    const queryAdmin = new URLSearchParams(location.search).get('admin') || '';
    const res = await fetch(`/api/admin/batch-import${queryAdmin ? `?admin=${queryAdmin}` : ''}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: filesData }),
    });

    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${res.status}`);
    }

    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `batch-codes-${new Date().toISOString().slice(0,10)}.xlsx`;
    a.click();
    URL.revokeObjectURL(url);

    msg.className = 'msg ok';
    msg.textContent = `生成完成，已自动下载 Excel。`;
  } catch (e) {
    msg.className = 'msg err';
    msg.textContent = `错误: ${e.message}`;
  } finally {
    btn.disabled = false;
    btn.textContent = '生成镜片码';
  }
}

function readFileAsBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
</script>
</body>
</html>
