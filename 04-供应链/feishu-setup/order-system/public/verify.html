<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{BRAND_NAME}} · 镜片真伪验证</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --brand: {{BRAND_COLOR}};
  --brand-dark: #1B3A5C;
  --success: #00B894;
  --error: #E74C3C;
  --gold: #E6B422;
  --text: #2C3E50;
  --text-muted: #7F8C8D;
  --bg: #F5F7FA;
  --font: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-num: 'Montserrat', 'SF Pro Display', var(--font);
  --font-mono: 'SF Mono', 'Menlo', monospace;
}

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

.hero {
  padding: 56px 20px 40px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
  pointer-events: none;
}
.hero-ok {
  background: linear-gradient(135deg, #00B894, #00CEC9);
}
.hero-fail {
  background: linear-gradient(135deg, #E74C3C, #C0392B);
}

.brand {
  font-family: var(--font-num);
  font-size: 16px;
  letter-spacing: 4px;
  margin-bottom: 28px;
  color: rgba(255,255,255,0.95);
}
.brand .gaush { font-weight: 700; }
.brand .sep { margin: 0 6px; opacity: 0.5; }
.brand .clear { font-weight: 400; }

.shield {
  width: 72px;
  height: 72px;
  margin: 0 auto 20px;
  background: rgba(255,255,255,0.2);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.shield svg { width: 36px; height: 36px; }

.hero-ok .shield svg { stroke: #fff; }
.hero-fail .shield svg { stroke: #fff; }

.status {
  font-size: 24px;
  font-weight: 700;
  margin-bottom: 10px;
  color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

.status-sub {
  font-size: 14px;
  color: rgba(255,255,255,0.85);
  line-height: 1.6;
}

.card {
  background: #fff;
  border-radius: 16px;
  margin: 16px 20px;
  padding: 22px;
  box-shadow: 0 4px 24px rgba(0,102,204,0.08);
  border: 1px solid rgba(0,102,204,0.04);
}
.card-title {
  font-size: 15px;
  font-weight: 600;
  color: var(--brand-dark);
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid #E0E6ED;
  border-left: 3px solid var(--brand);
  padding-left: 10px;
}

.row {
  display: flex;
  justify-content: space-between;
  padding: 10px 0;
  font-size: 14px;
}
.row .label { color: var(--text-muted); }
.row .value { font-weight: 500; color: var(--text); font-family: var(--font-num); }

.rx-table { width: 100%; font-size: 14px; border-collapse: collapse; }
.rx-table th {
  text-align: left;
  color: var(--text-muted);
  font-weight: 500;
  padding: 8px 0;
  font-size: 13px;
}
.rx-table td { padding: 10px 0; font-weight: 500; }
.rx-table .eye-tag {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
}
.eye-L { background: #E8F2FF; color: var(--brand); }
.eye-R { background: #FDEDEC; color: var(--error); }
.rx-num {
  font-family: var(--font-num);
  font-weight: 700;
  font-size: 16px;
  color: var(--text);
}

.footer {
  text-align: center;
  padding: 32px 20px 40px;
  font-size: 12px;
  color: var(--text-muted);
  line-height: 2.2;
}
.footer .mono {
  font-family: var(--font-mono);
  color: var(--text);
  font-size: 11px;
  letter-spacing: 1px;
}
.footer .brand-name {
  font-family: var(--font-num);
  letter-spacing: 3px;
  color: var(--brand);
  font-weight: 600;
  font-size: 13px;
}
.footer .divider {
  width: 40px;
  height: 2px;
  background: linear-gradient(90deg, var(--brand), var(--gold));
  margin: 12px auto;
  border-radius: 1px;
}
.lens-codes {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.lens-code-item {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.lens-code-side {
  font-size: 12px;
  color: var(--text-muted);
}
</style>
</head>
<body>

<div class="hero {{HERO_CLASS}}">
  <div class="brand">{{BRAND_DISPLAY}}</div>
  <div class="shield">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
      <polyline class="check" points="9 12 11 14 15 10"/>
      <line class="cross1" x1="15" y1="9" x2="9" y2="15"/>
      <line class="cross2" x1="9" y1="9" x2="15" y2="15"/>
    </svg>
  </div>
  <h1 class="status" id="statusText"></h1>
  <p class="status-sub" id="statusSub"></p>
</div>

<div id="foundContent" style="display:none">
  <div class="card">
    <div class="row" id="rowOrderNo" style="{{ORDER_NO_DISPLAY}}"><span class="label">订单号</span><span class="value">{{ORDER_NO}}</span></div>
    <div class="row"><span class="label">产品名称</span><span class="value">{{SKU_NAME}}</span></div>
  </div>

  <div class="card">
    <div class="card-title">处方参数</div>
    <table class="rx-table">
      <tr><th></th><th>球镜 SPH</th><th>柱镜 CYL</th><th>轴位 AXIS</th></tr>
      {{EYE_ROWS}}
    </table>
  </div>
</div>

<div class="footer">
  <div class="lens-codes">{{LENS_CODES}}</div>
  <p>验证时间 {{NOW}}</p>
  <div class="divider"></div>
  <p class="brand-name">{{BRAND_FOOTER}}{{BRAND_FOOTER_CONTACT}}</p>
</div>

<script>
var found = {{FOUND}};
var hero = document.querySelector('.hero');
var checkEl = document.querySelector('.check');
var cross1 = document.querySelector('.cross1');
var cross2 = document.querySelector('.cross2');

if (found) {
  hero.classList.add('hero-ok');
  cross1.style.display = 'none';
  cross2.style.display = 'none';
  document.getElementById('statusText').textContent = '正品验证通过';
  document.getElementById('statusSub').textContent = '该镜片已通过{{BRAND_NAME}}溯源系统认证';
  document.getElementById('foundContent').style.display = '';
} else {
  hero.classList.add('hero-fail');
  checkEl.style.display = 'none';
  document.getElementById('statusText').textContent = '未找到记录';
  document.getElementById('statusSub').innerHTML = '此镜片码未在系统中登记<br>请联系授权销售商确认产品真伪';
}
</script>
</body>
</html>
