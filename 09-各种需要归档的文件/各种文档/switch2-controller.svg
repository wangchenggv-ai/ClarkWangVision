<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 420" width="700" height="420">
  <defs>
    <!-- Gradient for screen -->
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop stop-color="#16213e" offset="50%"/>
      <stop stop-color="#0f3460" offset="100%"/>
    </linearGradient>
    <!-- Left Joy-Con gradient -->
    <linearGradient id="leftJoycon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ecdc4"/>
      <stop offset="100%" stop-color="#2ec4b6"/>
    </linearGradient>
    <!-- Right Joy-Con gradient -->
    <linearGradient id="rightJoycon" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="100%" stop-color="#ee5a24"/>
    </linearGradient>
    <!-- Button gradient -->
    <radialGradient id="btnGrad">
      <stop offset="0%" stop-color="#555"/>
      <stop offset="100%" stop-color="#333"/>
    </radialGradient>
    <!-- Stick gradient -->
    <radialGradient id="stickGrad" cx="0.4" cy="0.35">
      <stop offset="0%" stop-color="#666"/>
      <stop offset="100%" stop-color="#222"/>
    </radialGradient>
    <!-- Screen shine -->
    <linearGradient id="shine" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <filter id="innerGlow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2" result="blur"/>
      <feFlood flood-color="#fff" flood-opacity="0.1"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="700" height="420" rx="20" fill="#1a1a2e"/>

  <!-- Main body group with shadow -->
  <g filter="url(#shadow)">
    <!-- ===== LEFT JOY-CON ===== -->
    <g>
      <!-- Body -->
      <rect x="60" y="85" width="105" height="250" rx="22" fill="url(#leftJoycon)"/>
      <!-- Rail (magnetic connector) -->
      <rect x="155" y="110" width="10" height="200" rx="3" fill="#2a9d8f" opacity="0.6"/>
      <!-- Rounded grip bottom -->
      <path d="M60,290 Q40,310 45,340 Q50,360 75,355 L75,335 Q60,340 60,330 Z" fill="url(#leftJoycon)" opacity="0.9"/>

      <!-- Analog Stick (top) -->
      <circle cx="112" cy="155" r="22" fill="#222" stroke="#444" stroke-width="1.5"/>
      <circle cx="112" cy="155" r="17" fill="url(#stickGrad)"/>
      <circle cx="107" cy="150" r="5" fill="rgba(255,255,255,0.12)"/>

      <!-- Minus button -->
      <rect x="82" y="108" width="16" height="4" rx="2" fill="#333"/>
      <rect x="88" y="102" width="4" height="16" rx="2" fill="#333"/>

      <!-- Capture button (square) -->
      <rect x="108" y="290" width="16" height="16" rx="4" fill="#333" stroke="#555" stroke-width="1"/>
      <rect x="112" y="294" width="8" height="8" rx="1" fill="#555"/>

      <!-- SL / SR buttons on rail -->
      <rect x="156" y="140" width="7" height="20" rx="3" fill="#3d8b7f"/>
      <rect x="156" y="260" width="7" height="20" rx="3" fill="#3d8b7f"/>

      <!-- D-Pad -->
      <rect x="88" y="210" width="48" height="16" rx="4" fill="#333"/>
      <rect x="104" y="194" width="16" height="48" rx="4" fill="#333"/>
      <!-- D-Pad arrows -->
      <polygon points="93,218 98,213 103,218" fill="#555"/>
      <polygon points="121,218 126,213 131,218" fill="#555"/>
      <polygon points="112,200 107,205 117,205" fill="#555"/>
      <polygon points="112,236 107,231 117,231" fill="#555"/>

      <!-- Joystick rail dots -->
      <circle cx="112" cy="320" r="3" fill="#2a9d8f" opacity="0.5"/>
    </g>

    <!-- ===== SCREEN (Main Body) ===== -->
    <g>
      <!-- Outer frame -->
      <rect x="165" y="75" width="370" height="270" rx="18" fill="#2a2a3e"/>
      <!-- Inner bezel -->
      <rect x="172" y="82" width="356" height="256" rx="14" fill="#111"/>
      <!-- Screen -->
      <rect x="180" y="90" width="340" height="240" rx="10" fill="url(#screenGrad)"/>
      <!-- Screen shine overlay -->
      <rect x="180" y="90" width="340" height="240" rx="10" fill="url(#shine)"/>

      <!-- Switch 2 logo on screen -->
      <g transform="translate(350,210)" opacity="0.6">
        <!-- Joy-Con icon left -->
        <rect x="-45" y="-25" width="18" height="50" rx="6" fill="none" stroke="#4ecdc4" stroke-width="2"/>
        <circle cx="-36" cy="-8" r="5" fill="none" stroke="#4ecdc4" stroke-width="1.5"/>
        <rect x="-40" y="8" width="4" height="3" rx="1" fill="#4ecdc4"/>
        <rect x="-38" y="6" width="3" height="7" rx="1" fill="#4ecdc4"/>
        <!-- Joy-Con icon right -->
        <rect x="27" y="-25" width="18" height="50" rx="6" fill="none" stroke="#ff6b6b" stroke-width="2"/>
        <circle cx="36" cy="-8" r="5" fill="none" stroke="#ff6b6b" stroke-width="1.5"/>
        <rect x="30" y="5" width="10" height="10" rx="2" fill="none" stroke="#ff6b6b" stroke-width="1"/>
        <!-- Switch 2 text -->
        <text x="0" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#fff" letter-spacing="3">SWITCH 2</text>
      </g>

      <!-- Top bar indicators -->
      <circle cx="320" cy="96" r="2.5" fill="#2ecc71" opacity="0.7"/>
      <rect x="330" y="94" width="30" height="4" rx="2" fill="#333"/>
      <text x="370" y="98" font-family="Arial" font-size="7" fill="#555">100%</text>

      <!-- Camera dot -->
      <circle cx="350" cy="86" r="3" fill="#333"/>
      <circle cx="350" cy="86" r="1.5" fill="#222"/>

      <!-- Bottom rail indicators -->
      <rect x="173" y="330" width="354" height="4" rx="2" fill="#333" opacity="0.3"/>
    </g>

    <!-- ===== RIGHT JOY-CON ===== -->
    <g>
      <!-- Body -->
      <rect x="535" y="85" width="105" height="250" rx="22" fill="url(#rightJoycon)"/>
      <!-- Rail (magnetic connector) -->
      <rect x="535" y="110" width="10" height="200" rx="3" fill="#c0392b" opacity="0.5"/>
      <!-- Rounded grip bottom -->
      <path d="M640,290 Q660,310 655,340 Q650,360 625,355 L625,335 Q640,340 640,330 Z" fill="url(#rightJoycon)" opacity="0.9"/>

      <!-- Face Buttons (A/B/X/Y arranged in diamond) -->
      <g>
        <!-- A (right) -->
        <circle cx="588" cy="230" r="14" fill="url(#btnGrad)" stroke="#555" stroke-width="1"/>
        <text x="588" y="235" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">A</text>
        <!-- B (bottom) -->
        <circle cx="568" cy="250" r="14" fill="url(#btnGrad)" stroke="#555" stroke-width="1"/>
        <text x="568" y="255" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">B</text>
        <!-- X (top) -->
        <circle cx="568" cy="210" r="14" fill="url(#btnGrad)" stroke="#555" stroke-width="1"/>
        <text x="568" y="215" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">X</text>
        <!-- Y (left) -->
        <circle cx="548" cy="230" r="14" fill="url(#btnGrad)" stroke="#555" stroke-width="1"/>
        <text x="548" y="235" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Y</text>
      </g>

      <!-- Analog Stick (bottom) -->
      <circle cx="588" cy="290" r="22" fill="#222" stroke="#444" stroke-width="1.5"/>
      <circle cx="588" cy="290" r="17" fill="url(#stickGrad)"/>
      <circle cx="583" cy="285" r="5" fill="rgba(255,255,255,0.12)"/>

      <!-- Plus button -->
      <rect x="580" y="108" width="16" height="4" rx="2" fill="#333"/>
      <rect x="586" y="102" width="4" height="16" rx="2" fill="#333"/>

      <!-- Home button -->
      <circle cx="588" cy="155" r="10" fill="#333" stroke="#555" stroke-width="1"/>
      <rect x="583" y="150" width="10" height="10" rx="2" fill="none" stroke="#666" stroke-width="1.5"/>

      <!-- SL / SR buttons on rail -->
      <rect x="537" y="140" width="7" height="20" rx="3" fill="#a33"/>
      <rect x="537" y="260" width="7" height="20" rx="3" fill="#a33"/>

      <!-- Joystick rail dots -->
      <circle cx="588" cy="320" r="3" fill="#c0392b" opacity="0.5"/>
    </g>
  </g>

  <!-- Ambient light effects -->
  <ellipse cx="115" cy="340" rx="60" ry="8" fill="#4ecdc4" opacity="0.1"/>
  <ellipse cx="585" cy="340" rx="60" ry="8" fill="#ff6b6b" opacity="0.1"/>
</svg>
