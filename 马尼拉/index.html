<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>马尼拉 · Manila 实战辅助器</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    background: #1a2332;
    color: #e8ecf1;
    font-size: 13px;
  }

  /* 顶部状态条 */
  #header {
    display: flex; gap: 24px;
    padding: 10px 18px;
    background: #0f1a2a;
    border-bottom: 1px solid #2a3a50;
    align-items: center;
  }
  .hdr-cell { font-size: 13px; color: #b8c4d4; }
  .hdr-cell b { color: #ffd96a; }

  /* 主体两栏 */
  #app {
    display: grid;
    grid-template-columns: 1fr 380px;
    height: calc(100vh - 42px);
    overflow: hidden;
  }
  #left, #right {
    overflow-y: auto;
    padding: 12px 14px;
  }
  #left { background: radial-gradient(ellipse at top, #2b4869 0%, #0f1a2a 80%); }
  #right { background: #0f1a2a; border-left: 1px solid #2a3a50; }

  h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: 0.8px;
    color: #8fa4bf; margin: 14px 0 8px; font-weight: 600;
  }
  h3:first-child { margin-top: 0; }
  h4 { font-size: 12px; color: #b8c4d4; margin-bottom: 4px; }

  /* 船航道 */
  .ship-row {
    margin-bottom: 14px; padding: 10px 12px;
    background: rgba(15, 26, 42, 0.7); border-radius: 8px;
  }
  .ship-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; margin-bottom: 6px;
  }
  .ship-dot {
    display: inline-block; width: 12px; height: 12px;
    border-radius: 50%; border: 1px solid #555;
  }
  .ship-input {
    width: 50px; padding: 2px 6px; font-size: 13px;
    background: #1a2740; color: #e8ecf1;
    border: 1px solid #2a3a50; border-radius: 4px;
  }
  .ship-stats {
    font-size: 11px; color: #8fa4bf; margin-bottom: 6px;
  }
  .ship-stats b { color: #ffd96a; }

  /* 航道格 */
  .track {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 2px;
  }
  .track-cell {
    position: relative;
    height: 38px;
    border: 1px solid #2a3a50;
    border-radius: 3px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-size: 9px;
  }
  .track-cell.harbor { border-color: #4a7c4a; }
  .track-cell.near { border-color: #7c7c4a; }
  .track-cell.sea { border-color: #4a5e7c; }
  .ship-here {
    position: absolute; top: 2px; right: 3px;
    color: #ffd96a; font-size: 14px;
  }
  .cell-num { color: #b8c4d4; font-weight: 600; }
  .cell-prob { color: #8fa4bf; font-size: 8px; }

  /* 玩家表格 */
  table.players, table.market, table.reco {
    width: 100%; border-collapse: collapse; font-size: 12px;
  }
  table.players th, table.market th, table.reco th {
    text-align: left; padding: 4px 6px;
    color: #8fa4bf; font-weight: 500;
    border-bottom: 1px solid #2a3a50;
  }
  table.players td, table.market td, table.reco td {
    padding: 4px 6px; border-bottom: 1px solid #1a2740;
  }
  table.players tr.me { background: rgba(255, 217, 106, 0.08); }
  .stock-input, .cash-input, .market-input {
    width: 50px; padding: 2px 4px;
    background: #1a2740; color: #e8ecf1;
    border: 1px solid #2a3a50; border-radius: 4px;
    font-size: 12px;
  }

  /* 输入面板 */
  .dice-row {
    display: flex; gap: 8px; align-items: center;
    margin-bottom: 12px; font-size: 13px;
  }
  .die-input, .role-input {
    background: #1a2740; color: #e8ecf1;
    border: 1px solid #2a3a50; border-radius: 4px;
    padding: 4px 6px; font-size: 13px;
  }
  .die-input { width: 60px; font-size: 18px; text-align: center; font-weight: 700; }
  .roles-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 6px 10px; margin-bottom: 12px;
  }
  .role-cell {
    display: flex; flex-direction: column; gap: 2px;
  }
  .role-cell label { font-size: 11px; color: #8fa4bf; }
  .role-input { width: 100%; }

  #advance-btn {
    width: 100%; padding: 8px;
    background: #1e4068; color: #ffd96a;
    border: 1px solid #2a5a8a; border-radius: 6px;
    font-size: 13px; font-weight: 600; cursor: pointer;
  }
  #advance-btn:hover { background: #2a5a8a; }

  /* 权重滑块 */
  .weight-row {
    display: grid;
    grid-template-columns: 110px 1fr 30px;
    gap: 8px; align-items: center;
    margin-bottom: 6px; font-size: 12px;
  }
  .weight-row input[type=range] { width: 100%; }
  .hint { font-size: 11px; color: #8fa4bf; margin-top: 4px; }

  /* 推荐 */
  .reco-block { margin-bottom: 14px; }
  table.reco tr.best { background: rgba(255, 217, 106, 0.12); }
  table.reco td:first-child { color: #e8ecf1; }
  .reco-error { color: #c97a7a; font-size: 12px; padding: 4px 0; }
  .muted { color: #8fa4bf; font-size: 11px; }

  /* 初始化弹窗 */
  #setup {
    position: fixed; inset: 0;
    background: rgba(15, 26, 42, 0.95);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .setup-box {
    background: #1a2740; padding: 24px 32px;
    border-radius: 8px; border: 1px solid #2a3a50;
    min-width: 380px;
  }
  .setup-box h2 { font-size: 16px; margin-bottom: 16px; color: #ffd96a; }
  .setup-row {
    margin-bottom: 12px; font-size: 13px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .setup-row input, .setup-row select {
    background: #0f1a2a; color: #e8ecf1;
    border: 1px solid #2a3a50; border-radius: 4px;
    padding: 6px 8px; font-size: 13px;
  }
  #setup-btn {
    width: 100%; padding: 10px;
    background: #1e4068; color: #ffd96a;
    border: 1px solid #2a5a8a; border-radius: 6px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    margin-top: 8px;
  }
  #setup-btn:hover { background: #2a5a8a; }

  input[type=number]::-webkit-inner-spin-button {
    opacity: 1;
  }
</style>
</head>
<body>
  <div id="setup" style="display:flex;"></div>

  <div id="header"></div>
  <div id="app">
    <main id="left">
      <div id="ships-panel"></div>
      <div id="market-panel"></div>
      <div id="players-panel"></div>
    </main>
    <aside id="right">
      <div id="input-panel"></div>
      <div id="reco-panel"></div>
      <div id="weights-panel"></div>
    </aside>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
